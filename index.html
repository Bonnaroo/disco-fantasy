<!DOCTYPE html>

<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body { font-family: var(--font-sans); color: var(--text-body); -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--chain-300); border-radius: 5px; border: 2px solid var(--bg-page); }
  ::-webkit-scrollbar-thumb:hover { background: var(--chain-400); }
  @keyframes chains-pulse { 0% { box-shadow: 0 0 0 0 rgba(255,90,31,.5); } 70% { box-shadow: 0 0 0 6px rgba(255,90,31,0); } 100% { box-shadow: 0 0 0 0 rgba(255,90,31,0); } }
  @keyframes chains-slide { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
